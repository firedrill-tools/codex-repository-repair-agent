name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Permit the pinned CLI sandbox on this disposable Ubuntu runner
        run: node scripts/codex-ci-profile.js install
      - run: npm run fixtures:build
      - run: git diff --exit-code -- datasets
      - run: npm test
      - run: npm ci --prefix firedrill --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix firedrill
      - run: npm run check:package
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: codex-repair-source
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Remove the CI-only AppArmor profile
        if: always()
        run: node scripts/codex-ci-profile.js remove
